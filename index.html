<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120f1f">
<title>夜市彈珠台</title>
<link rel="preload" href="vendor/phaser-lite.js?v=20261016111453" as="script">
<style>
  html,body{margin:0;height:100%;background:#120f1f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #game{position:fixed;inset:0}
  #start{position:fixed;inset:0;z-index:10;background:#120f1f;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:safe center;overflow-y:auto;touch-action:pan-y;padding:24px 16px;box-sizing:border-box;color:#e9e4ff;font:16px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;touch-action:manipulation}
  #start h1{margin:0;font-size:34px;color:#ffc94d;letter-spacing:.08em}
  #start .sub{margin:0;color:#8f86b3;font-size:14px}
  #start label{font-size:14px;color:#8f86b3;align-self:center}
  #name{font-family:inherit;font-size:20px;width:min(260px,80vw);padding:10px 12px;border-radius:10px;border:2px solid #3a2f5c;background:#1c1730;color:#fff;text-align:center;-webkit-user-select:text;user-select:text}
  #name:focus{outline:none;border-color:#ffc94d}
  #stall,#go.main{font-family:inherit;font-size:22px;font-weight:700;color:#1c1730;background:#ffc94d;border:0;border-radius:12px;padding:12px 46px;min-height:52px}
  #go{font-family:inherit;font-size:15px;color:#e9e4ff;background:#2a2340;border:1px solid #3a2f5c;border-radius:20px;padding:8px 18px;min-height:40px}
  #go[disabled],#stall[disabled]{opacity:.6}
  #people{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:320px}
  #people button{font-family:inherit;font-size:14px;color:#e9e4ff;background:#2a2340;border:1px solid #3a2f5c;border-radius:16px;padding:6px 12px;min-height:36px}
  #rec{min-height:2.6em;text-align:center;color:#c9c1ee;font-size:14px;line-height:1.5}
  #msg{color:#8f86b3;font-size:13px;min-height:1.4em}
  #retry{display:none;font:inherit;color:#1c1730;background:#ffc94d;border:0;border-radius:10px;padding:10px 20px;min-height:44px}
  #board{display:flex;flex-wrap:wrap;gap:12px 18px;justify-content:center;font-size:13px;color:#c9c1ee;min-height:1em}
  #board h3{margin:0 0 4px;font-size:13px;color:#ffc94d;font-weight:700;text-align:center}
  #board ol{margin:0;padding-left:1.6em;line-height:1.55}
  #board .me{color:#ffc94d;font-weight:700}
  #tutorial{font-family:inherit;font-size:15px;color:#ffc94d;background:transparent;border:1px solid #5a4a20;border-radius:20px;padding:8px 18px;min-height:40px}
  #challenge{display:none;max-width:320px;text-align:center;background:#2a2340;border:2px solid #ffc94d;border-radius:12px;padding:10px 14px;color:#fff;font-size:16px;line-height:1.5}
  #daily{font-family:inherit;font-size:16px;color:#1c1730;background:#7fd6a6;border:0;border-radius:12px;padding:10px 20px;min-height:44px}
  #shelfBtn{display:none;font-family:inherit;font-size:15px;color:#e9e4ff;background:#2a2340;border:1px solid #3a2f5c;border-radius:20px;padding:8px 18px;min-height:40px}
  #shelf{display:none;max-width:340px;background:#1c1730;border:1px solid #3a2f5c;border-radius:12px;padding:12px;text-align:center}
  #shelf .tk{color:#ffc94d;font-weight:700;margin-bottom:8px}
  #shelf .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  #shelf button{font-family:inherit;font-size:12px;color:#e9e4ff;background:#2a2340;border:1px solid #3a2f5c;border-radius:10px;padding:6px 2px;min-height:72px;line-height:1.3}
  #shelf button .ic{font-size:28px;display:block}
  #shelf button.own{border-color:#ffc94d}
  #shelf button[disabled]{opacity:.45}
  #ver{position:fixed;right:6px;bottom:4px;color:#4b4370;font:11px monospace;pointer-events:none;z-index:11}
  /* 玩家問卷（10/16）：跟給作者的審閱頁同一套做法——一題一塊、按鈕作答、每題可以補一句、最後自由填寫 */
  #fbBtn{font-family:inherit;font-size:15px;color:#c9c1ee;background:transparent;border:1px solid #3a2f5c;border-radius:20px;padding:8px 18px;min-height:40px}
  #fb{display:none;position:fixed;inset:0;z-index:30;background:rgba(10,8,20,.82);overflow-y:auto;touch-action:pan-y;-webkit-user-select:text;user-select:text}
  #fb .panel{max-width:420px;margin:20px auto 40px;background:#1c1730;border:1px solid #3a2f5c;border-radius:14px;padding:18px 16px;color:#e9e4ff;font:16px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;box-sizing:border-box;width:calc(100% - 32px)}
  #fb h2{margin:0 0 4px;font-size:22px;color:#ffc94d}
  #fb .ctx{color:#8f86b3;font-size:14px;margin:0 0 12px}
  #fb .q{border-top:1px solid #2f2750;padding:12px 0}
  #fb .q h3{margin:0 0 8px;font-size:17px}
  #fb .q .d{color:#8f86b3;font-size:13px;margin:-4px 0 8px}
  #fb .opts{display:flex;flex-wrap:wrap;gap:8px}
  #fb button{font:inherit;font-size:15px;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid #3a2f5c;background:#2a2340;color:#e9e4ff}
  #fb button[aria-pressed="true"]{background:#4a3d72;border-color:#ffc94d;color:#ffc94d;font-weight:700}
  #fb .more{background:transparent;border:0;color:#8fb7d6;font-size:14px;min-height:36px;padding:4px 0}
  #fb input,#fb textarea{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:#fff;background:#120f1f;border:1px solid #3a2f5c;border-radius:8px;padding:8px 10px;margin-top:6px}
  #fb textarea{min-height:90px}
  #fb .row{display:flex;gap:10px;margin-top:14px;position:sticky;bottom:0;background:#1c1730;padding:10px 0 4px}
  #fb .send{flex:1;background:#ffc94d;color:#1c1730;border:0;font-weight:700;font-size:18px}
  #fb .msg{min-height:1.4em;color:#9be37a;font-size:15px;margin-top:8px}
</style>
</head>
<body>
<div id="start">
  <h1>夜市彈珠台</h1>
  <p class="sub">珍珠會彈、麻糬會黏、鐵球撞得倒釘子</p>
  <div id="challenge"></div>
  <label for="name">你的名字</label>
  <input id="name" maxlength="12" autocomplete="off" enterkeyhint="go" placeholder="輸入名字">
  <div id="people"></div>
  <div id="rec"></div>
  <button id="stall" type="button">開始</button>
  <button id="go" type="button">自由玩（拚總分）</button>
  <button id="daily" type="button">今日挑戰：大家玩同一局</button>
  <button id="tutorial" type="button">怎麼玩？看教學</button>
  <button id="fbBtn" type="button">📝 給做遊戲的人意見</button>
  <button id="shelfBtn" type="button">🎁 獎品櫃</button>
  <div id="shelf"></div>
  <div id="board"></div>
  <div id="msg">載入中…</div>
  <button id="retry" type="button">點一下重試</button>
</div>
<div id="game"></div>
<div id="fb" role="dialog" aria-modal="true" aria-labelledby="fbTitle"><div class="panel"></div></div>
<div id="ver"></div>
<script>
// 開始畫面（2026-10-15）：一打開網址就出現，不等遊戲引擎；輸入名字的同時引擎在背後下載。
// 按「開始」那一下同時打開聲音（手機規定要先點過畫面才能出聲；之前第一次點才打開，前一兩顆球沒聲音）。
// 紀錄存在這支手機（localStorage，每個名字分開：今日最高、歷史最高、最近 20 局），之後接 Cloudflare 排行榜。
// 版本號：發佈腳本會把 20261016111453 換成發佈時間，用來讓手機拿到新檔，也顯示在右下角。
(function () {
  var VER = '20261016111453', DEV = VER.indexOf('__') === 0;
  document.getElementById('ver').textContent = DEV ? 'dev' : 'v' + VER;

  // ── 紀錄 ──
  var REC_KEY = 'nm_records', NAME_KEY = 'nm_name';
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 私密瀏覽等存不了就算了 */ } }
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  // ── 獎品櫃（F7，2026-10-15）：每 100 分 1 張彩票，換夜市獎品。圖先用表情符號，風格定了再換成美術 ──
  var TICKET_PER = 100;
  var PRIZES = [
    { id: 'candy', icon: '🍭', name: '棒棒糖', cost: 10 },
    { id: 'balloon', icon: '🎈', name: '氣球', cost: 20 },
    { id: 'fish', icon: '🐠', name: '撈到的金魚', cost: 30 },
    { id: 'yoyo', icon: '🪀', name: '溜溜球', cost: 40 },
    { id: 'mask', icon: '👺', name: '天狗面具', cost: 60 },
    { id: 'bear', icon: '🧸', name: '小熊娃娃', cost: 80 },
    { id: 'robot', icon: '🤖', name: '機器人', cost: 120 },
    { id: 'lantern', icon: '🏮', name: '大紅燈籠', cost: 160 },
    { id: 'crown', icon: '👑', name: '夜市王冠', cost: 250 },
  ];
  window.NM_records = {
    get: function (name) { return (load(REC_KEY, {})[name]) || null; },
    all: function () { return load(REC_KEY, {}); },
    // 回傳 { best, todayBest, newBest, newToday }
    add: function (name, score) {
      var all = load(REC_KEY, {}), r = all[name] || { best: 0, daily: {}, games: 0, recent: [] }, t = today();
      var newBest = score > r.best, newToday = score > (r.daily[t] || 0);
      if (newBest) r.best = score;
      if (newToday) r.daily[t] = score;
      r.games++; r.recent.unshift({ t: Date.now(), s: score }); r.recent = r.recent.slice(0, 20);
      var got = Math.floor(score / TICKET_PER); r.tickets = (r.tickets || 0) + got; r.prizes = r.prizes || {};
      var days = Object.keys(r.daily).sort(); while (days.length > 60) delete r.daily[days.shift()];
      all[name] = r; save(REC_KEY, all);
      return { best: r.best, todayBest: r.daily[t], newBest: newBest, newToday: newToday, tickets: got, ticketsTotal: r.tickets };
    },
    today: today,
    redeem: function (name, id) {
      var all = load(REC_KEY, {}), r = all[name], p = PRIZES.filter(function (x) { return x.id === id; })[0];
      if (!r || !p || (r.tickets || 0) < p.cost) return false;
      r.tickets -= p.cost; r.prizes = r.prizes || {}; r.prizes[id] = (r.prizes[id] || 0) + 1;
      all[name] = r; save(REC_KEY, all); return true;
    },
  };

  // ── 線上排行榜（Cloudflare Workers＋D1，使用者的免費方案）：連不上就只用手機紀錄，不擋遊戲 ──
  // 測試一律送到測試用排行榜（2026-10-15 使用者同意另開）：本機版、網址帶 ?staging、自動化瀏覽器（navigator.webdriver）
  var STAGING = DEV || /[?&]staging\b/.test(location.search) || !!navigator.webdriver;
  var API = STAGING ? 'https://nm-pinball-api-staging.quiet-notes-7k2.workers.dev' : 'https://nm-pinball-api.quiet-notes-7k2.workers.dev';
  function cloud(path, body) {
    var ctl = window.AbortController ? new AbortController() : null; if (ctl) setTimeout(function () { ctl.abort(); }, 6000);
    return fetch(API + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl && ctl.signal } : { signal: ctl && ctl.signal })
      .then(function (r) { return r.json(); });
  }
  window.NM_cloud = {
    submit: function (name, score) { return cloud('/score', { name: name, score: score, ver: VER, mode: window.NM_mode || 'free' }).then(function (d) { if (d && d.today) drawBoard(d); return d; }); },
    // 匿名遊玩數據（使用者 10/16 同意）：只有隨機的手機代號，不送名字
    event: function (d) { d.ver = VER; d.sid = sid(); return cloud('/event', d).catch(function () {}); },
    top: function () { return cloud('/top').then(function (d) { drawBoard(d); return d; }); },
  };
  function sid() { var s = load('nm_sid', ''); if (!s) { s = Math.random().toString(36).slice(2, 12); save('nm_sid', s); } return s; }

  // ── 玩家問卷（2026-10-16 使用者：「幫我設計問卷讓玩家可以在遊戲上自由填寫嗎 就像寫給我的彙報一樣」）──
  // 一題一塊、按鈕作答、每題可「補一句」、最後自由填寫；全部選填。不送名字，只送隨機手機代號與剛剛玩的關卡。
  // 結果看：node tools/feedback_report.cjs（加 --staging 看測試用）
  var FB_QS = [
    { id: 'F1', q: '剛剛這關好玩嗎？', o: ['😆 很好玩', '🙂 還可以', '😐 有點無聊'] },
    { id: 'F2', q: '難度？', o: ['太簡單', '剛好', '太難'] },
    { id: 'F3', q: '打輸的時候，覺得是？', d: '沒輸過可以跳過', o: ['自己哪一顆打錯', '一半一半', '運氣不好'] },
    { id: 'F4', q: '現在最想？', o: ['再打一次這關', '玩下一關', '先休息'] },
    { id: 'F5', q: '最喜歡哪個東西？', o: ['金魚', '連鎖爆', '爆米花', '硬殼', '數字燈籠', '撈網', '老闆招牌', '三種彈珠'] },
  ];
  var FB_KEY = 'nm_fb', fbEl = document.getElementById('fb'), fbCtx = null;
  function fbDevice() { var u = navigator.userAgent; return /iPhone|iPad|iPod/.test(u) ? 'ios' : /Android/.test(u) ? 'android' : 'desktop'; }
  function esc(s) { return String(s).replace(/[<>&"]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]; }); }
  window.NM_feedback = function (ctx) {
    fbCtx = ctx || {};
    var where = fbCtx.level ? '剛剛玩：' + fbCtx.level + ' ' + (fbCtx.levelName || '') + (fbCtx.result === 'clear' ? '（過關 ' + '★'.repeat(fbCtx.stars || 0) + '）' : fbCtx.result === 'fail' ? '（沒過）' : '') : '隨時都可以填，每題都可以跳過';
    var h = '<h2 id="fbTitle">給做遊戲的人：30 秒問卷</h2><p class="ctx">' + esc(where) + '</p>';
    FB_QS.forEach(function (x) {
      h += '<div class="q" data-q="' + x.id + '"><h3>' + esc(x.q) + '</h3>' + (x.d ? '<p class="d">' + esc(x.d) + '</p>' : '') + '<div class="opts">';
      x.o.forEach(function (o) { h += '<button type="button" data-v="' + esc(o) + '" aria-pressed="false">' + esc(o) + '</button>'; });
      h += '</div><button type="button" class="more">＋補一句</button><input type="text" maxlength="200" placeholder="想多說的（選填）" hidden></div>';
    });
    h += '<div class="q"><h3>還有什麼想跟做遊戲的人說？</h3><p class="d">哪裡卡住、想要什麼新玩法、哪裡看不懂，都可以寫（選填）</p><textarea id="fbText" maxlength="500"></textarea></div>';
    h += '<div class="row"><button type="button" class="send">送出</button><button type="button" class="close">下次再說</button></div><div class="msg" role="status"></div>';
    fbEl.querySelector('.panel').innerHTML = h;
    fbEl.style.display = 'block'; fbEl.scrollTop = 0;
    gameInput(false);   // 問卷開著時遊戲不收觸控：iPhone 上遊戲的觸控處理會把問卷捲回最上面，按「送出」放開時落在別的按鈕（10/16 自動測試抓到）
    var st = load(FB_KEY, {}); st.shown = (st.shown || 0) + 1; if (fbCtx.zone) { st.asked = st.asked || {}; st.asked[fbCtx.zone] = 1; } save(FB_KEY, st);
  };
  // 自動問一次：每一區最多一次（玩完那一區最後一關、或那一區打滿 4 局）；填過就不再自動跳
  window.NM_feedbackShouldAsk = function (zone, endsInZone, lastLevel) {
    var st = load(FB_KEY, {});
    return !(st.asked && st.asked[zone]) && (lastLevel || endsInZone >= 4);
  };
  function gameInput(on) { try { var g = window.__game && window.__game.game; if (g && g.input) g.input.enabled = on; } catch (e) {} }
  function fbClose() { fbEl.style.display = 'none'; gameInput(true); if (fbCtx && fbCtx.onClose) fbCtx.onClose(); }
  fbEl.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) { if (e.target === fbEl) fbClose(); return; }
    var q = b.closest('.q');
    if (b.classList.contains('more')) { var inp = q.querySelector('input'); inp.hidden = false; inp.focus(); b.hidden = true; return; }
    if (b.classList.contains('close')) { fbClose(); return; }
    if (b.classList.contains('send')) {
      var answers = {}, notes = {};
      fbEl.querySelectorAll('.q[data-q]').forEach(function (el) {
        var on = el.querySelector('button[aria-pressed="true"]'), inp = el.querySelector('input');
        if (on) answers[el.dataset.q] = on.dataset.v;
        if (inp && inp.value.trim()) notes[el.dataset.q] = inp.value.trim();
      });
      var text = document.getElementById('fbText').value.trim(), msg = fbEl.querySelector('.msg');
      if (!Object.keys(answers).length && !Object.keys(notes).length && !text) { msg.style.color = '#ffb36b'; msg.textContent = '還沒填任何一題喔'; return; }
      b.disabled = true; msg.style.color = '#c9c1ee'; msg.textContent = '送出中…';
      var body = { sid: sid(), stall: fbCtx.zone || null, level: fbCtx.level || null, result: fbCtx.result || null, stars: fbCtx.stars, answers: answers, notes: notes, text: text, device: fbDevice(), ver: VER };
      cloud('/feedback', body).then(function (d) {
        if (!d || !d.ok) throw new Error(d && d.error);
        var st = load(FB_KEY, {}); st.sent = (st.sent || 0) + 1; save(FB_KEY, st);
        msg.style.color = '#9be37a'; msg.textContent = '收到了，謝謝你！🙏';
        setTimeout(fbClose, 1200);
      }).catch(function () { b.disabled = false; msg.style.color = '#ffb36b'; msg.textContent = '沒送出去（網路不穩或按太快），等一下再按一次'; });
      return;
    }
    if (q && b.dataset.v != null) {   // 單選：再按一次取消
      var was = b.getAttribute('aria-pressed') === 'true';
      q.querySelectorAll('.opts button').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', was ? 'false' : 'true');
    }
  });
  document.getElementById('fbBtn').onclick = function () { window.NM_feedback({}); };
  function drawBoard(d) {
    var el = document.getElementById('board'), me = nameEl.value.trim();
    function list(title, rows) {
      if (!rows || !rows.length) return '';
      return '<div><h3>' + title + '</h3><ol>' + rows.slice(0, 5).map(function (r) { var n = String(r.name).replace(/[<>&"]/g, ''); return '<li' + (n === me ? ' class="me"' : '') + '>' + n + '　' + r.score + '</li>'; }).join('') + '</ol></div>';
    }
    el.innerHTML = list('今日挑戰', d.daily) + list('今日排行', d.today) + list('歷史排行', d.all);
  }

  var start = document.getElementById('start'), nameEl = document.getElementById('name'), go = document.getElementById('go');
  var msg = document.getElementById('msg'), retry = document.getElementById('retry'), recEl = document.getElementById('rec'), people = document.getElementById('people');
  nameEl.value = load(NAME_KEY, '') || '';
  function showRec() {
    var n = nameEl.value.trim(), r = n && NM_records.get(n);
    recEl.textContent = r ? '今日最高 ' + (r.daily[today()] || 0) + ' 分　歷史最高 ' + r.best + ' 分\n玩過 ' + r.games + ' 局' : (n ? '第一次玩，加油！' : '');
    recEl.style.whiteSpace = 'pre-line';
  }
  function showPeople() {
    var names = Object.keys(NM_records.all()); people.innerHTML = '';
    if (names.length < 2) return;
    names.forEach(function (n) { var b = document.createElement('button'); b.type = 'button'; b.textContent = n; b.onclick = function () { nameEl.value = n; showRec(); }; people.appendChild(b); });
  }
  var shelf = document.getElementById('shelf');
  function drawShelf() {
    var n = nameEl.value.trim() || '玩家', r = NM_records.get(n) || {}, tk = r.tickets || 0, own = r.prizes || {};
    shelf.innerHTML = '<div class="tk">' + n.replace(/[<>&"]/g, '') + ' 的彩票：' + tk + ' 張（每 100 分 1 張）</div><div class="grid">' +
      PRIZES.map(function (p) { return '<button type="button" data-id="' + p.id + '"' + (own[p.id] ? ' class="own"' : '') + (tk < p.cost ? ' disabled' : '') + '><span class="ic">' + p.icon + '</span>' + p.name + '<br>' + (own[p.id] ? '已有 ' + own[p.id] + '・' : '') + p.cost + ' 張</button>'; }).join('') + '</div>';
  }
  shelf.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-id]'); if (!b) return;
    var n = nameEl.value.trim() || '玩家';
    if (NM_records.redeem(n, b.dataset.id)) drawShelf();
  });
  document.getElementById('shelfBtn').onclick = function () { var on = shelf.style.display === 'block'; if (!on) drawShelf(); shelf.style.display = on ? 'none' : 'block'; };
  nameEl.addEventListener('input', function () { if (shelf.style.display === 'block') drawShelf(); });
  nameEl.addEventListener('input', showRec);
  // 按 Enter 等於按主按鈕：平常是清台，朋友挑戰時是「接受挑戰」
  nameEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { nameEl.blur(); (friend ? go : stallBtn).click(); } });
  showRec(); showPeople();
  NM_cloud.top().catch(function () {});
  window.NM_showStart = function () { showRec(); showPeople(); NM_cloud.top().catch(function () {}); start.style.display = 'flex'; resetButtons(); };

  // ── 聲音：在「開始」這一下打開（game.js 的 Sound 會接手這個 AudioContext）──
  function unlockAudio() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    var A = window.NM_audio || (window.NM_audio = {});
    try {
      if (!A.ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) A.ctx = new AC(); }
      if (A.ctx) {
        if (A.ctx.state === 'suspended') A.ctx.resume();
        var b = A.ctx.createBuffer(1, 1, 22050), s = A.ctx.createBufferSource(); s.buffer = b; s.connect(A.ctx.destination); s.start(0);
      }
    } catch (e) {}
  }

  // ── 開始 ──
  var ready = false, wantStart = false;
  // 10/16 使用者定案：清台是遊戲本體，「開始」直接進清台；原本的拚總分降成「自由玩」
  var stallBtn = document.getElementById('stall');
  function resetButtons() { go.disabled = stallBtn.disabled = false; stallBtn.textContent = '開始'; go.textContent = friend ? '接受挑戰' : '自由玩（拚總分）'; }
  var wantTutorial = false;
  // ── 挑戰（2026-10-15）：朋友分享的連結 ?c=種子&from=名字&s=分數 → 同一局；今日挑戰 → 用台灣日期當種子，大家同一局 ──
  var q = new URLSearchParams(location.search), friend = null, mode = 'free';
  if (q.get('c') && /^\d{1,10}$/.test(q.get('c'))) {
    friend = { seed: +q.get('c'), from: (q.get('from') || '朋友').slice(0, 12), score: Math.max(0, parseInt(q.get('s'), 10) || 0), mode: 'friend' };
    var box = document.getElementById('challenge');
    box.textContent = friend.from + ' 挑戰你！他打了 ' + friend.score + ' 分\n同一局，你打得贏嗎？';
    box.style.whiteSpace = 'pre-line'; box.style.display = 'block';
    go.textContent = '接受挑戰'; go.classList.add('main');
  }
  function dailySeed() { var t = today(), h = 2166136261; for (var k = 0; k < t.length; k++) { h ^= t.charCodeAt(k); h = Math.imul(h, 16777619); } return (h >>> 0) % 2147483646 + 1; }
  function begin() {
    var n = nameEl.value.trim() || '玩家';
    save(NAME_KEY, n); wantStart = false;
    start.style.display = 'none';
    window.NM_challenge = mode === 'daily' ? { seed: dailySeed(), mode: 'daily' } : friend;
    window.NM_mode = mode === 'daily' ? 'daily' : 'free';
    if (mode === 'stall') { window.NM_mode = 'stall'; window.NM_beginStall(n); return; }
    window.NM_begin(n, wantTutorial); wantTutorial = false;
  }
  stallBtn.onclick = function () { mode = 'stall'; go.onclick(); };
  document.getElementById('daily').onclick = function () { mode = 'daily'; go.onclick(); };
  // 看教學：第一次玩會自動進教學，這個按鈕是給想再看一次的人
  document.getElementById('tutorial').onclick = function () { mode = 'free'; wantTutorial = true; go.onclick(); };
  go.onclick = function (e) {
    if (e) mode = 'free';
    unlockAudio();
    if (ready) begin(); else { wantStart = true; go.disabled = stallBtn.disabled = true; (mode === 'stall' ? stallBtn : go).textContent = '載入中…'; }
  };

  // ── 載入：依序載入 Phaser 與遊戲程式；失敗自動重試，回到前景再試，用完顯示「點一下重試」──
  var files = ['vendor/phaser-lite.js', 'game.js'];
  var i = 0, tries = 0, busy = false;
  window.NM_ready = function () { ready = true; msg.textContent = ''; if (wantStart) begin(); };
  function next() {
    if (i >= files.length) return;
    busy = true; msg.textContent = '載入中…（' + (i + 1) + '/' + files.length + '）';
    var s = document.createElement('script');
    s.src = files[i] + (DEV ? '' : '?v=' + VER);
    s.onload = function () { busy = false; i++; tries = 0; next(); };
    s.onerror = function () {
      busy = false; s.remove(); tries++;
      if (tries < 3) { msg.textContent = '網路不穩，重新載入中…（第 ' + (tries + 1) + ' 次）'; setTimeout(function () { if (!document.hidden) next(); }, 1500); }
      else { msg.textContent = '載入失敗，網路可能不穩'; retry.style.display = 'block'; }
    };
    document.body.appendChild(s);
  }
  retry.onclick = function () { retry.style.display = 'none'; tries = 0; next(); };
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !busy && i < files.length && retry.style.display !== 'block') setTimeout(next, 500);
  });
  next();

  // ── 存在手機裡：第二次打開幾乎不用等，沒網路也能玩（service worker）──
  if ('serviceWorker' in navigator && !DEV) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js?v=' + VER).catch(function () {}); });
  }
})();
</script>
</body>
</html>
